<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marcone Ramos Nutri · Tabela de substituição</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Paleta do site Marcone Ramos — Nutrição para a vida real */
  :root {
    --navy: #102E40;         /* azul-marinho: cartão, aba ativa */
    --navy-2: #1C3C4F;       /* azul de apoio dentro do cartão */
    --navy-line: #3A5362;
    --ink: #193747;          /* texto principal */
    --paper: #FAF9F6;        /* fundo papel */
    --surface: #FFFFFF;
    --cream: #F1EEE7;        /* creme das seções claras */
    --orange: #EEA476;       /* pêssego: botão WhatsApp, destaques no azul */
    --orange-hover: #F5B58C;
    --accent: #B86538;       /* terracota: destaques em fundo claro */
    --accent-soft: #F6EBE2;
    --muted: #64727A;
    --line: #DCE1E0;
    --on-navy: #F5F5EE;
    --on-navy-muted: #A8BDC7;
    --serif: Georgia, "Times New Roman", serif;
    --display: "Manrope", "Segoe UI", system-ui, sans-serif;
    --body: "DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 18px 48px; }

  /* Perfil */
  .perfil { display: flex; align-items: center; gap: 16px; }
  .logo {
    width: 72px; height: 72px; border-radius: 50%; flex: none;
    background: var(--navy); color: var(--on-navy);
    display: grid; place-items: center; overflow: hidden;
    font-family: var(--serif); font-size: 28px; letter-spacing: -0.04em;
    border: 3px solid var(--paper); box-shadow: 0 0 0 1px var(--line);
  }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  .perfil h1 {
    font-family: var(--serif); font-weight: 400; font-size: 26px;
    line-height: 1.15; margin: 0; letter-spacing: -0.01em; color: var(--navy);
  }
  .perfil p {
    margin: 4px 0 0; color: var(--accent); font-size: 11px; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase;
  }

  .contatos { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 28px; }
  .contatos a {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 14px; border-radius: 5px;
    background: var(--surface); border: 1px solid #B7C3C8;
    color: inherit; text-decoration: none; font-weight: 600; font-size: 13px;
    transition: background .2s, transform .2s;
  }
  .contatos a:hover { background: var(--cream); }
  .contatos a.wpp { background: var(--orange); border-color: var(--orange); color: #173242; }
  .contatos a.wpp:hover { background: var(--orange-hover); transform: translateY(-1px); }
  .contatos svg { width: 17px; height: 17px; }

  /* Grupos */
  .grupos {
    display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; margin-bottom: 14px;
    background: var(--cream); border-radius: 26px;
  }
  .grupos button {
    flex: 1 1 auto; min-height: 44px; font: 600 14px var(--body); cursor: pointer;
    padding: 8px 12px; border: 0; border-radius: 999px; white-space: nowrap;
    background: transparent; color: var(--ink);
    transition: background-color .2s ease, color .2s ease, box-shadow .2s ease;
  }
  .grupos button:hover { background: rgba(255, 255, 255, .75); }
  /* No celular: duas colunas iguais; um grupo ímpar no fim ocupa a linha toda */
  @media (max-width: 540px) {
    .grupos { display: grid; grid-template-columns: 1fr 1fr; border-radius: 24px; }
    .grupos button:last-child:nth-child(odd) { grid-column: 1 / -1; }
  }
  .grupos button[aria-pressed="true"] {
    background: var(--navy); color: var(--on-navy);
    box-shadow: 0 1px 2px rgba(16, 46, 64, .18), 0 4px 10px -4px rgba(16, 46, 64, .35);
  }

  /* Cartão-frase */
  .frase {
    background: var(--navy); color: var(--on-navy);
    border-radius: 48px 10px 10px 10px; padding: 24px 22px 20px;
    position: relative; overflow: hidden; isolation: isolate;
  }
  .frase::before {
    content: ""; position: absolute; width: 260px; height: 260px; right: -150px; top: -60px;
    border: 1px solid #66808C; border-radius: 50%; opacity: .5; z-index: -1;
  }
  .frase .linha {
    font-family: var(--display); font-weight: 500;
    font-size: clamp(26px, 7vw, 34px); line-height: 1.2; letter-spacing: -0.045em;
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px;
  }
  .qtd {
    display: inline-flex; align-items: baseline;
    border-bottom: 3px solid var(--orange);
  }
  .qtd input {
    width: 3.2ch; font: inherit; color: var(--orange); background: transparent;
    border: 0; padding: 0; text-align: right; -moz-appearance: textfield;
  }
  .qtd input::-webkit-outer-spin-button,
  .qtd input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .qtd span { color: var(--orange); margin-left: 2px; }

  .seletor { position: relative; flex: 1 1 100%; }
  .seletor select {
    width: 100%; font: inherit; color: var(--on-navy);
    background: transparent; border: 0; border-bottom: 3px solid var(--on-navy-muted);
    padding: 0 34px 2px 0; appearance: none; -webkit-appearance: none; cursor: pointer;
    text-overflow: ellipsis;
  }
  .seletor select.vazio { color: var(--on-navy-muted); }
  .seletor select option { color: var(--ink); font: 500 16px var(--body); }
  .seletor::after {
    content: ""; position: absolute; right: 6px; top: 45%;
    width: 11px; height: 11px; border-right: 3px solid var(--on-navy-muted);
    border-bottom: 3px solid var(--on-navy-muted); transform: translateY(-60%) rotate(45deg);
    pointer-events: none;
  }

  .ajustes { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 20px; }
  .ajustes button {
    font: 600 13px var(--body); cursor: pointer; color: var(--on-navy);
    background: var(--navy-2); border: 1px solid var(--navy-line);
    border-radius: 5px; padding: 7px 12px; min-width: 42px;
    transition: border-color .15s ease;
  }
  .ajustes button:hover { border-color: #66808C; }
  .ajustes .sep { width: 1px; height: 22px; background: var(--navy-line); margin: 0 4px; }

  /* Resultado */
  .resultado { margin-top: 30px; }
  .resultado-topo { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .resultado h2 {
    color: var(--ink);
    font-family: var(--display); font-weight: 500; font-size: 22px;
    letter-spacing: -0.045em; margin: 0;
  }
  .busca {
    font: 500 14px var(--body); color: inherit;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 5px; padding: 8px 12px; width: 46%; min-width: 130px;
  }
  .busca::placeholder { color: var(--muted); }

  .lista { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 8px; border: 1px solid var(--line); overflow: hidden; }
  .lista li + li { border-top: 1px solid var(--line); }
  .lista button {
    all: unset; box-sizing: border-box; cursor: pointer; width: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 13px 16px;
  }
  .lista button:hover { background: var(--paper); }
  .lista .nome { font-weight: 500; }
  .lista .g {
    font-family: var(--display); font-weight: 600; font-size: 20px; letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--navy);
  }
  .lista .g small { font-size: 14px; margin-left: 2px; font-weight: 500; color: var(--muted); }
  .lista .g.sem { color: var(--accent); font-weight: 600; font-size: 13px; font-family: var(--body); letter-spacing: 0; }
  .lista li.ref button { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--orange); }
  .lista li.ref .nome::after {
    content: "seu alimento"; margin-left: 8px; font-size: 11px; font-weight: 600;
    background: var(--orange); color: #173242; padding: 2px 8px; border-radius: 4px;
    vertical-align: 2px;
  }
  .lista .nada { padding: 18px 16px; color: var(--muted); }

  .aviso { margin: 18px 4px 0; font-size: 12px; color: var(--muted); }

  :focus-visible { outline: 3px solid #C66B36; outline-offset: 3px; border-radius: 5px; }
  @media (prefers-reduced-motion: no-preference) {
    .lista li.flash .g { animation: pulse .35s ease-out; }
    @keyframes pulse { from { transform: scale(1.12); } to { transform: scale(1); } }
  }
</style>
</head>
<body>
<main class="wrap">

  <header class="perfil">
    <div class="logo" id="logo"></div>
    <div>
      <h1 id="nome"></h1>
      <p id="subtitulo"></p>
    </div>
  </header>
  <nav class="contatos" id="contatos" aria-label="Contato"></nav>

  <div class="grupos" id="grupos" role="group" aria-label="Grupo de alimentos"></div>

  <section class="frase" aria-label="Alimento a substituir">
    <div class="linha">
      <span>Trocar</span>
      <label class="qtd">
        <input id="qtd" type="number" inputmode="numeric" min="0" max="9999" value="100" aria-label="Quantidade em gramas">
        <span>g</span>
      </label>
      <span>de</span>
      <span class="seletor">
        <select id="alimento" aria-label="Alimento do seu plano"></select>
      </span>
    </div>
    <div class="ajustes" aria-label="Ajustar quantidade">
      <button type="button" data-delta="-10" aria-label="Menos 10 gramas">−10</button>
      <button type="button" data-delta="10" aria-label="Mais 10 gramas">+10</button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" data-set="30">30 g</button>
      <button type="button" data-set="50">50 g</button>
      <button type="button" data-set="100">100 g</button>
    </div>
  </section>

  <section class="resultado" aria-live="polite">
    <div class="resultado-topo">
      <h2 id="titulo-res">Pode trocar por</h2>
      <input class="busca" id="busca" type="search" placeholder="Buscar alimento" aria-label="Buscar alimento na lista">
    </div>
    <ul class="lista" id="lista"></ul>
    <p class="aviso" id="aviso"></p>
  </section>

</main>

<script>
  // Dados pré-carregados (compatíveis com os do Google Sheets)
  const DADOS_PADRAO = {
    config: {
      nome: 'Marcone Ramos Nutri',
      subtitulo: 'Nutricionista · CRN 51047',
      whatsapp: '558184445268',
      instagram: 'marconeramosnutri',
      logoUrl: '',
      aviso: 'As quantidades são aproximadas e equivalem em calorias. Siga sempre as orientações do seu plano alimentar.'
    },
    grupos: [
      {
        nome: 'Frutas',
        alimentos: [
          { nome: 'Abacate', kcal: 96 },
          { nome: 'Abacaxi', kcal: 48 },
          { nome: 'Acerola', kcal: 33 },
          { nome: 'Ameixa', kcal: 53 },
          { nome: 'Amora', kcal: 43 },
          { nome: 'Banana', kcal: 98 },
          { nome: 'Bergamota/Tangerina', kcal: 38 },
          { nome: 'Caqui', kcal: 71 },
          { nome: 'Goiaba', kcal: 54 },
          { nome: 'Jabuticaba', kcal: 58 },
          { nome: 'Kiwi', kcal: 51 },
          { nome: 'Laranja', kcal: 37 },
          { nome: 'Maçã', kcal: 56 },
          { nome: 'Mamão', kcal: 40 },
          { nome: 'Manga', kcal: 64 },
          { nome: 'Maracujá', kcal: 68 },
          { nome: 'Melancia', kcal: 33 },
          { nome: 'Melão', kcal: 29 },
          { nome: 'Mirtilo', kcal: 57 },
          { nome: 'Morango', kcal: 30 },
          { nome: 'Pera', kcal: 53 },
          { nome: 'Pêssego', kcal: 36 },
          { nome: 'Physalis', kcal: 53 },
          { nome: 'Pitaya', kcal: 50 },
          { nome: 'Tâmara', kcal: 282 },
          { nome: 'Uva', kcal: 53 }
        ]
      },
      {
        nome: 'Gordura vegetal',
        alimentos: [
          { nome: 'Abacate', kcal: 96 },
          { nome: 'Amêndoas', kcal: 604 },
          { nome: 'Amendoim', kcal: 544 },
          { nome: 'Castanha-do-pará', kcal: 643 },
          { nome: 'Nozes', kcal: 620 },
          { nome: 'Óleos vegetais', kcal: 884 }
        ]
      },
      {
        nome: 'Carboidratos',
        alimentos: [
          { nome: 'Abóbora cabotiá', kcal: 48 },
          { nome: 'Água de coco', kcal: 22 },
          { nome: 'Amido de milho', kcal: 361 },
          { nome: 'Arroz branco ou integral (cozido)', kcal: 128 },
          { nome: 'Aveia', kcal: 394 },
          { nome: 'Batata-baroa (mandioquinha)', kcal: 80 },
          { nome: 'Batata-doce', kcal: 77 },
          { nome: 'Batata-inglesa', kcal: 52 },
          { nome: 'Cuscuz (desidratado)', kcal: 360 },
          { nome: 'Farinha de mandioca', kcal: 365 },
          { nome: 'Feijão (cozido)', kcal: 76 },
          { nome: 'Macarrão (cozido)', kcal: 102 },
          { nome: 'Mandioca (cozida)', kcal: 125 },
          { nome: 'Pão francês', kcal: 300 },
          { nome: 'Pinhão (cozido)', kcal: 174 },
          { nome: 'Pipoca', kcal: 387 },
          { nome: 'Polenta', kcal: 70 },
          { nome: 'Polpa de açaí', kcal: 58 },
          { nome: 'Suco de uva integral', kcal: 58 },
          { nome: 'Tapioca (goma)', kcal: 240 }
        ]
      },
      {
        nome: 'Proteína',
        alimentos: [
          { nome: 'Albumina', kcal: 372 },
          { nome: 'Atum em água e sal', kcal: 116 },
          { nome: 'Atum light', kcal: 100 },
          { nome: 'Camarão cozido ou assado', kcal: 90 },
          { nome: 'Carne vermelha magra', kcal: 219 },
          { nome: 'Clara de ovo', kcal: 59 },
          { nome: 'Filé de frango', kcal: 159 },
          { nome: 'Fígado bovino', kcal: 225 },
          { nome: 'Lombo suíno', kcal: 210 },
          { nome: 'Ovo inteiro', kcal: 146 },
          { nome: 'Peixe de água doce', kcal: 128 },
          { nome: 'Salmão sem pele', kcal: 229 },
          { nome: 'Soja texturizada crua', kcal: 330 },
          { nome: 'Tofu cru', kcal: 76 },
          { nome: 'Whey protein', kcal: 400 }
        ]
      },
      {
        nome: 'Laticínios',
        alimentos: [
          { nome: 'Iogurte 2 Ingredientes Nestlé Desnatado', kcal: 36 },
          { nome: 'Iogurte 2 Ingredientes Nestlé Integral', kcal: 77 },
          { nome: 'Iogurte Batavo Grego Zero 10+ Pedaços', kcal: 62 },
          { nome: 'Iogurte Grego Vigor Zero', kcal: 56 },
          { nome: 'Leite desnatado', kcal: 34 },
          { nome: 'Leite em pó desnatado', kcal: 362 },
          { nome: 'Leite em pó integral', kcal: 497 },
          { nome: 'Leite integral', kcal: 58 },
          { nome: 'Leite semidesnatado', kcal: 49 },
          { nome: 'Queijo cottage', kcal: 100 },
          { nome: 'Queijo minas frescal', kcal: 264 },
          { nome: 'Queijo minas meia cura', kcal: 330 },
          { nome: 'Queijo quark', kcal: 82 },
          { nome: 'Queijo ricota', kcal: 140 },
          { nome: 'Queijos amarelos', kcal: 360 },
          { nome: 'Requeijão light', kcal: 180 }
        ]
      }
    ]
  };

  // Ordena os alimentos por ordem alfabética (como no Apps Script)
  DADOS_PADRAO.grupos.forEach(g => {
    g.alimentos.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  });

  let DADOS = DADOS_PADRAO;
  let cfg = DADOS.config || {};
  let grupos = DADOS.grupos || [];

  const $ = id => document.getElementById(id);
  const estado = { grupo: 0, alimento: '', qtd: 100, busca: '' };

  function initApp() {
    cfg = DADOS.config || {};
    grupos = DADOS.grupos || [];

    // Perfil
    $('nome').textContent = cfg.nome || 'Tabela de substituição';
    $('subtitulo').textContent = cfg.subtitulo || '';
    if (cfg.nome) {
      document.title = cfg.nome + ' · Tabela de substituição';
    }
    
    $('logo').innerHTML = '';
    if (cfg.logoUrl) {
      const img = document.createElement('img');
      img.src = cfg.logoUrl; img.alt = cfg.nome || 'Logo';
      $('logo').appendChild(img);
    } else {
      $('logo').textContent = (cfg.nome || '?').split(/\s+/).map(p => p[0]).slice(0, 2).join('').toUpperCase();
    }

    const icones = {
      wpp: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.4-.3Z"/></svg>',
      insta: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>'
    };

    $('contatos').innerHTML = '';
    const contatos = [];
    if (cfg.whatsapp) contatos.push(['wpp', 'WhatsApp', 'https://wa.me/' + cfg.whatsapp.replace(/\D/g, '')]);
    if (cfg.instagram) {
      const igUser = cfg.instagram.replace(/^[@/]+|[/]+$/g, '');
      contatos.push(['insta', 'Instagram', 'https://instagram.com/' + igUser]);
    }

    contatos.forEach(([tipo, rotulo, href]) => {
      const a = document.createElement('a');
      a.href = href; a.target = '_blank'; a.rel = 'noopener';
      if (tipo === 'wpp') a.className = 'wpp';
      a.innerHTML = icones[tipo] + '<span></span>';
      a.querySelector('span').textContent = rotulo;
      $('contatos').appendChild(a);
    });
    $('contatos').style.display = contatos.length ? 'flex' : 'none';

    $('aviso').textContent = cfg.aviso || 'As quantidades são aproximadas e equivalem em calorias. Siga sempre as orientações do seu plano alimentar.';

    // Grupos
    $('grupos').innerHTML = '';
    grupos.forEach((g, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = g.nome;
      b.addEventListener('click', () => {
        estado.grupo = i; estado.alimento = ''; estado.busca = ''; $('busca').value = '';
        render();
      });
      $('grupos').appendChild(b);
    });

    ajustaLargura();
    render();
  }

  // ---------- Controles ----------
  $('alimento').addEventListener('change', e => { estado.alimento = e.target.value; render(); });
  $('qtd').addEventListener('input', e => {
    estado.qtd = Math.max(0, Number(e.target.value) || 0);
    ajustaLargura(); renderLista();
  });
  document.querySelectorAll('.ajustes button').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.set) estado.qtd = Number(b.dataset.set);
    else estado.qtd = Math.max(0, estado.qtd + Number(b.dataset.delta));
    $('qtd').value = estado.qtd; ajustaLargura(); renderLista();
  }));
  $('busca').addEventListener('input', e => { estado.busca = e.target.value; renderLista(); });

  function ajustaLargura() {
    $('qtd').style.width = Math.max(1, String($('qtd').value).length) + 0.4 + 'ch';
  }

  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const fmt = n => n >= 10 ? Math.round(n).toLocaleString('pt-BR')
                           : (Math.round(n * 2) / 2).toLocaleString('pt-BR');

  // ---------- Render ----------
  function render() {
    const g = grupos[estado.grupo];
    document.querySelectorAll('#grupos button').forEach((b, i) =>
      b.setAttribute('aria-pressed', i === estado.grupo));

    const sel = $('alimento');
    sel.innerHTML = '';
    const ph = new Option('escolha o alimento', '');
    ph.disabled = true; sel.add(ph);
    (g ? g.alimentos : []).forEach(a => sel.add(new Option(a.nome, a.nome)));
    sel.value = estado.alimento;
    if (!estado.alimento) ph.selected = true;
    sel.classList.toggle('vazio', !estado.alimento);

    renderLista();
  }

  function renderLista() {
    const g = grupos[estado.grupo];
    const lista = $('lista');
    lista.innerHTML = '';
    if (!g) { lista.innerHTML = '<li class="nada">Nenhum alimento cadastrado.</li>'; return; }

    const ref = g.alimentos.find(a => a.nome === estado.alimento);
    const kcalTotal = ref ? ref.kcal * estado.qtd / 100 : 0;
    $('titulo-res').textContent = ref ? 'Pode trocar por' : 'Alimentos do grupo';

    const itens = g.alimentos.filter(a => !estado.busca || norm(a.nome).includes(norm(estado.busca)));
    if (!itens.length) {
      lista.innerHTML = '<li class="nada">Nenhum alimento com esse nome neste grupo.</li>';
      return;
    }

    itens.forEach(a => {
      const li = document.createElement('li');
      if (ref && a.nome === ref.nome) li.className = 'ref';
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-label', ref
        ? a.nome + ': ' + fmt(kcalTotal / a.kcal * 100) + ' gramas'
        : 'Escolher ' + a.nome);

      const nome = document.createElement('span');
      nome.className = 'nome'; nome.textContent = a.nome;

      const gr = document.createElement('span');
      if (ref) {
        gr.className = 'g';
        gr.innerHTML = fmt(kcalTotal / a.kcal * 100) + '<small>g</small>';
      } else {
        gr.className = 'g sem'; gr.textContent = 'escolher';
      }

      b.append(nome, gr);
      // Tocar em qualquer linha transforma esse alimento na referência
      b.addEventListener('click', () => {
        estado.alimento = a.nome;
        render();
        const alvo = [...$('lista').children].find(x => x.classList.contains('ref'));
        if (alvo) alvo.classList.add('flash');
        document.querySelector('.frase').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      li.appendChild(b);
      lista.appendChild(li);
    });
  }

  // Permite carregar dinamicamente via query param ?api=... ou arquivo dados.json se existir
  const urlParams = new URLSearchParams(window.location.search);
  const apiUrl = urlParams.get('api');
  if (apiUrl) {
    fetch(apiUrl)
      .then(res => res.json())
      .then(dados => {
        if (dados && dados.grupos) {
          DADOS = dados;
          initApp();
        }
      })
      .catch(err => {
        console.warn('Não foi possível carregar da API, usando dados padrão:', err);
        initApp();
      });
  } else {
    initApp();
  }
</script>
</body>
</html>
